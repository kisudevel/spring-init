# 배포용 설정. application.properties 위에 덧씌웁니다.
# 여기 적지 않은 값은 application.properties 의 것을 그대로 씁니다.
# 접속 정보는 파일에 적지 않습니다. 서버의 환경변수에서 읽습니다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# 표를 지우지 않습니다. 없는 것만 만들고 나머지는 그대로 둡니다.
spring.jpa.hibernate.ddl-auto=update
# 씨앗 데이터는 마리아DB 문법으로 된 파일에서 읽습니다.
# data.sql 은 H2 전용이라 여기서는 쓰지 않습니다.
spring.sql.init.data-locations=classpath:data-mariadb.sql
spring.sql.init.mode=never
# 배포 서버에서는 SQL 로그와 H2 콘솔을 끕니다.
spring.jpa.show-sql=false
spring.h2.console.enabled=false
logging.level.org.hibernate.session.metrics=off
app.refresh-cookie.same-site=None
app.frontend-url=https://blog-rest-front-gjda.vercel.app
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
